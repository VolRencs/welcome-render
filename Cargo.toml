[package]
name = "welcome-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Native scene compositor for GOPlay welcome images"
repository = "https://github.com/VolRencs/welcome-render"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fontdb = "0.24.0"
image-webp = "0.2.4"
napi = { version = "3.16.1", features = ["napi10"] }
napi-derive = "3.7.0"
png = "0.18.1"
rustybuzz = "0.20.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25.1"
unicode-bidi = "0.3.18"
zune-jpeg = "0.5.15"
zune-png = "0.5.2"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
chunks_exact_to_as_chunks = "allow"
